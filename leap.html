<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leap Year Checker</title>
    <link rel="stylesheet" href="./leap.css" />
</head>
<body>
    <div class="container">
        <div class="card">
          <h1>Leap Year Checker</h1>
          <p class="subtitle">Enter a year to determine if it's a leap year.</p>
          <input type="number" id="yearInput" placeholder="e.g. 2024" />
          <button onclick="checkLeapYear()">Check Year</button>
          <div class="result" id="resultText"></div>
        </div>
      </div>

    <script src="leap.js" charset="UTF-8"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</body>
</html>
